<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WanderWise</title>
<!-- Marked.js for markdown rendering and DOMPurify for security -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<!-- Optional: used only to draw A2UI Icon components -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root { --accent:#1a73e8; --bg:#f6f8fa; --border:#dfe3e8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); display:flex; flex-direction:column; height:100vh; }
  header { background:var(--accent); color:#fff; padding:.9rem 1.2rem; font-weight:700; font-size:1.1rem; }
  #log { flex:1; overflow-y:auto; padding:1.2rem; max-width:850px; width:100%; margin:0 auto; }
  .msg { margin:.8rem 0; }
  .msg.user { text-align:right; }
  .bubble { display:inline-block; padding:.8rem 1.1rem; border-radius:12px; background:#fff; border:1px solid var(--border); text-align:left; max-width:92%; line-height:1.5; }
  .msg.user .bubble { background:var(--accent); color:#fff; border:none; white-space:pre-wrap; }
  /* When the reply is an A2UI card, drop the bubble chrome so the card stands alone. */
  .bubble.rich { background:transparent; border:none; padding:0; max-width:100%; }
  form { display:flex; gap:.5rem; padding:1rem; border-top:1px solid var(--border); background:#fff; }
  input { flex:1; padding:.7rem; border:1px solid var(--border); border-radius:8px; font-size:1rem; }
  button { padding:.7rem 1.2rem; border:none; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }

  /* Markdown content styling */
  .markdown-body { color:#24292f; }
  .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 { margin-top:1rem; margin-bottom:.5rem; font-weight:600; }
  .markdown-body h1 { font-size:1.4rem; border-bottom:1px solid var(--border); padding-bottom:.3rem; }
  .markdown-body h2 { font-size:1.25rem; border-bottom:1px solid #eee; padding-bottom:.2rem; }
  .markdown-body h3 { font-size:1.1rem; }
  .markdown-body p { margin-top:0; margin-bottom:.8rem; }
  .markdown-body ul, .markdown-body ol { margin-top:0; margin-bottom:.8rem; padding-left:1.5rem; }
  .markdown-body li { margin-bottom:.3rem; }
  .markdown-body a { color:var(--accent); text-decoration:underline; font-weight:500; }
  .markdown-body a:hover { color:#1557b0; text-decoration:underline; }
  .markdown-body blockquote { margin:0 0 .8rem 0; padding:0 1rem; color:#57606a; border-left:.25rem solid #d0d7de; }
  .markdown-body code { font-family:monospace; background:rgba(175,184,193,0.2); padding:.15rem .3rem; border-radius:4px; font-size:.9em; }
  .markdown-body pre code { display:block; padding:.8rem; overflow-x:auto; }

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card { border:1px solid var(--border); border-radius:12px; padding:1rem; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.06); max-width:100%; margin-bottom:.6rem; }
  .a2card + .a2card, .a2col > .a2card { margin-top:.6rem; }
  .a2col { display:flex; flex-direction:column; gap:.4rem; }
  .a2row { display:flex; flex-direction:row; gap:.6rem; align-items:center; flex-wrap:wrap; }
  .a2row.between { justify-content:space-between; }
  .a2text { margin:0; line-height:1.4; }
  .a2text.a2-h1 { font-size:1.5rem; font-weight:700; }
  .a2text.a2-h2 { font-size:1.25rem; font-weight:700; }
  .a2text.a2-h3 { font-size:1.1rem; font-weight:600; }
  .a2text.a2-h4 { font-size:1rem; font-weight:600; }
  .a2text.a2-caption { font-size:.85rem; color:#666; }
  .a2divider { border:none; border-top:1px solid var(--border); margin:.4rem 0; width:100%; }
  .a2img { max-width:100%; border-radius:8px; display:block; }
  .material-symbols-outlined { font-family:'Material Symbols Outlined'; font-size:1.25rem; line-height:1; vertical-align:middle; color:var(--accent); }
</style>
</head>
<body>
<header>WanderWise Concierge</header>
<div id="log"></div>
<form id="form">
  <input id="input" placeholder="Ask something…" autocomplete="off" autofocus>
  <button>Send</button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

// Configure marked to open all links in new tab
if (typeof marked !== "undefined") {
  const renderer = new marked.Renderer();
  const linkRenderer = renderer.link.bind(renderer);
  renderer.link = (href, title, text) => {
    // Marked v5+ may pass an object or positional arguments
    let linkHref = typeof href === 'object' ? href.href : href;
    let linkTitle = typeof href === 'object' ? href.title : title;
    let linkText = typeof href === 'object' ? href.text : text;
    const titleAttr = linkTitle ? ` title="${linkTitle}"` : "";
    return `<a href="${linkHref}" target="_blank" rel="noopener noreferrer"${titleAttr}>${linkText}</a>`;
  };
  marked.setOptions({
    renderer: renderer,
    gfm: true,
    breaks: true
  });
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const b = el("div", "bubble");
  m.appendChild(b); log.appendChild(m); log.scrollTop = log.scrollHeight;
  return b;
}

function renderMarkdown(md) {
  if (typeof marked !== "undefined" && typeof DOMPurify !== "undefined") {
    const rawHtml = marked.parse(md);
    return DOMPurify.sanitize(rawHtml, { ADD_ATTR: ['target', 'rel'] });
  }
  // Fallback: convert markdown links [text](url) to HTML links
  const escaped = md.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return escaped.replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      const content = boundStr(props.text);
      if (/\[.*?\]\(https?:\/\/.*?\)/.test(content) || /<a\s/i.test(content)) {
        t.innerHTML = renderMarkdown(content);
      } else {
        t.textContent = content;
      }
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n\n").trim();
  if (textStr) {
    const textContainer = el("div", "markdown-body");
    textContainer.innerHTML = renderMarkdown(textStr);
    b.appendChild(textContainer);
  }

  if (a2ui.length) {
    b.classList.add("rich");
    const a2uiBox = el("div", "a2ui-container");
    if (!renderSurface(a2ui, a2uiBox)) {
      const fallback = flattenText(a2ui);
      if (fallback) {
        const fallbackBox = el("div", "markdown-body");
        fallbackBox.innerHTML = renderMarkdown(fallback);
        b.appendChild(fallbackBox);
      }
    } else {
      b.appendChild(a2uiBox);
    }
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
